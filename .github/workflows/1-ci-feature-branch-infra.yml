# .github/workflows/1-ci-feature-branch-infra.yml
name: Feature Branch CI (infra)

# Trigger:
# - Automatic on every push to a feat/**, feature/** or JIRA/** branch, but
#   ONLY when files under infra/** changed — Terraform is the one thing this
#   job checks, so there's no point running it for a Python-only commit.
# - workflow_dispatch, for re-running by hand from the GitHub UI.
#
# Purpose: catch `terraform fmt` drift as early as possible (on every push),
# before a PR is even opened, so reviewers aren't the ones flagging it.
#
# Known gap: there's no equivalent fast-feedback job for src/** (the Python
# Lambda code) — this repo has no lint config or test suite yet, so the only
# CI signal Python changes get today is the docker build + smoke test in
# 2-ci-merge-request.yml, which only runs once a PR is opened.
on:
  workflow_dispatch:
  push:
    branches:
      - 'feat/**'
      - 'feature/**'
      - 'JIRA/**'
    paths:
      - infra/**

jobs:
  lint-and-unit-tests:
    name: Static Analysis & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: 1. ⬇️ Checkout Code
        uses: actions/checkout@v4

      - name: 2. ⚙️ Setup Terraform Cli
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.0"

      - name: 3. 🧪 Check Terraform Syntax
        working-directory: infra
        run: terraform fmt -check
