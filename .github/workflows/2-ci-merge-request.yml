# .github/workflows/2-ci-merge-request.yml
name: Merge Request CI

# Trigger:
# - Runs when a pull request targets the `main` branch.
#
# Purpose: verify the Lambda container actually builds and boots before the
# PR merges (merging to main auto-deploys to prod — see 3-prd-release-mr.yml
# — so this is the only gate standing between a broken image and production).
#
# The "smoke test" step starts the built image and lets it run for 10s. The
# Lambda base image's runtime interface client sits waiting for an invocation
# rather than exiting, so a healthy container gets killed by `timeout` (exit
# code 124) — that counts as a pass. Any other exit code means the container
# crashed on startup (e.g. a missing import, bad Dockerfile step) and fails
# the job.
on:
  pull_request:
    branches:
      - main

jobs:
  docker-build-smoke-test:
    name: 🐳 Build & Smoke Test Lambda Image
    runs-on: ubuntu-latest

    steps:
      - name: 1. ⬇️ Checkout Code
        uses: actions/checkout@v4

      - name: 2. 🛠️ Build Docker Image
        run: docker build -t lambda-docker .

      - name: 3. 🔍 Smoke Test Docker Container
        run: timeout 10 docker run --rm lambda-docker || [[ $? -eq 124 ]]
