# .github/workflows/4-prd-release-tag.yml
name: Production Release

# Trigger:
# - workflow_dispatch — run by hand from the GitHub UI / CLI against any ref,
#   used to redeploy prd without merging new code (e.g. re-applying infra,
#   or a rollback by dispatching against an older vX.Y.Z tag).
# - push of a vX.Y.Z tag — covers a tag pushed manually. Note this normally
#   does NOT get triggered by the vX.Y.Z tag that 3-prd-release-mr.yml
#   creates after a merge, since that tag is pushed with the default
#   GITHUB_TOKEN and GitHub doesn't re-trigger workflows from that token's
#   own pushes. So in practice this path fires for a human-pushed tag.
#
# Same two deploy steps as 3-prd-release-mr.yml (terraform apply, then build
# + push + point Lambda at the new image) — kept here as a separate,
# independent entry point rather than reusing that workflow, so a manual
# redeploy never depends on a pull_request event existing.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+' # e.g., v1.2.0

jobs:
  infra-deploy-prd:
    name: Provision Infrastructure (Production)
    runs-on: ubuntu-latest
    environment: prd

    outputs:
      ECR_REPOSITORY_URL: ${{ steps.deploy.outputs.ecr_repository_url }}
      FUNCTION_NAME: ${{ steps.deploy.outputs.function_name }}

    steps:
      # Guards against dispatching this workflow against a branch or an
      # arbitrary commit — a prd deploy should only ever run from a
      # released vX.Y.Z tag.
      - name: 1. 🧪 Validate Tag Format
        run: |
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid tag format: $GITHUB_REF"
            exit 1
          fi

      - name: 2. ⬇️ Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: 3. 🔐 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: 4. ⚙️ Setup Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.0"

      - name: 5. 🚀 Apply Terraform for Production Infra
        id: deploy
        working-directory: infra
        env:
          TF_VAR_telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          terraform init -input=false
          terraform workspace select -or-create prd-app
          terraform plan --var-file=config/prd.tfvars -out=output.tfplan -input=false
          terraform apply -input=false --auto-approve output.tfplan
          echo "ECR_REPOSITORY_URL=$(terraform output -raw ecr_repository_url)" >> $GITHUB_OUTPUT
          echo "FUNCTION_NAME=$(terraform output -raw function_name)" >> $GITHUB_OUTPUT


  docker-deploy-prd:
    name: Build & Deploy Docker to Lambda (prd)
    runs-on: ubuntu-latest
    environment: prd
    needs: infra-deploy-prd
    if: success()

    steps:
      - name: 1. ⬇️ Checkout Code
        uses: actions/checkout@v4

      - name: 2. 🔐 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: 3. 🐳 Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 4. 🏷️ Set Docker Image Tag
        id: vars
        run: echo "TAG=prd-${{ github.sha }}" >> $GITHUB_ENV

      - name: 5. 🛠️ Build Docker Image
        run: |
          docker build -t ${{ needs.infra-deploy-prd.outputs.ECR_REPOSITORY_URL }}:$TAG .

      - name: 6. 📤 Push Docker Image to ECR
        run: |
          docker push ${{ needs.infra-deploy-prd.outputs.ECR_REPOSITORY_URL }}:$TAG

      - name: 7. 🔄 Update Lambda Function with New Image
        run: |
          aws lambda update-function-code \
            --function-name ${{ needs.infra-deploy-prd.outputs.FUNCTION_NAME }} \
            --image-uri ${{ needs.infra-deploy-prd.outputs.ECR_REPOSITORY_URL }}:$TAG
